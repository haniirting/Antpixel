
name: Build Ant Empire AI APK

on:
  push:
    paths:
      - "AntEmpireAI.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          if [ ! -f AntEmpireAI.zip ]; then
            echo "ERROR: Upload AntEmpireAI.zip to repository root"
            exit 1
          fi

          mkdir extracted
          unzip -o AntEmpireAI.zip -d extracted

          cp -an extracted/. .
          rm -rf extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AntEmpireAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
