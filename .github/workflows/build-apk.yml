
name: Build Ant Empire AI APK

on:
  push:
    paths:
      - "AntEmpireAI.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and extract project
        shell: bash
        run: |
          set -e

          if [ ! -f AntEmpireAI.zip ]; then
            echo "::error::AntEmpireAI.zip is missing from the repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq AntEmpireAI.zip -d extracted

          if [ ! -f extracted/settings.gradle.kts ] && \
             [ ! -f extracted/settings.gradle ]; then
            PROJECT_DIR="$(find extracted -name settings.gradle.kts -o -name settings.gradle | head -n 1 | xargs -r dirname)"
            if [ -z "$PROJECT_DIR" ]; then
              echo "::error::Gradle settings file was not found in the ZIP."
              exit 1
            fi
          else
            PROJECT_DIR="extracted"
          fi

          cp -an "$PROJECT_DIR"/. .
          rm -rf extracted

          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "::error::Gradle project was not copied to the repository root."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AntEmpireAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
